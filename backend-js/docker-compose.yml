version: "3.8"

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: blockchain_user
      POSTGRES_PASSWORD: blockchain_password
      POSTGRES_DB: blockchain_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockchain_user -d blockchain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
